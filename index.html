<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abolfazl ❤️ Niayesh</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Opening Scene -->
    <section id="scene1">

        <!-- Stars Background -->
        <div class="stars"></div>

        <div class="intro">

            <h1>
                For the most beautiful person in my life...
            </h1>

            <p>
                A story written by two hearts
            </p>


            <button id="startBtn">
                Start Our Story ❤️
            </button>

        </div>


    </section>


<!-- Scene 2 -->

<section id="scene2">


    <div class="heart-container">


        <div class="heart">
            ❤️
        </div>


        <p>
            Two hearts...<br>
            One story...
        </p>


    </div>


</section>
<script src="script.js"></script>

<!-- Scene 3 : World of Light and Love -->
<section id="scene3" class="scene hidden">
  <div class="love-bg"></div>
  <div class="blur-orb orb1"></div>
  <div class="blur-orb orb2"></div>
  <div class="blur-orb orb3"></div>

  <div class="particles" id="particles"></div>
  <div class="floating-hearts" id="floatingHearts"></div>

  <div class="scene3-content">
    <h1 class="scene3-title">Welcome to Our World ✨</h1>
    <p class="scene3-subtitle">
      A place where every light is a memory, every heartbeat is your name,
      and every second feels like a beautiful dream.
    </p>

    <div class="glow-line"></div>

    <button id="toScene4" class="next-btn">
      Open The Letter 💌
    </button>
